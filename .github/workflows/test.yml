name: test

on:
    push:
        branches: [master]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                # Node 22 is EOL (Apr 2026) and Jest 30 needs Node 24.9+ for require(esm)
                node-version: [24]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - run: make ci
            - uses: actions/upload-artifact@v4
              if: matrix.node-version == 24
              with:
                  name: coverage
                  path: coverage/
